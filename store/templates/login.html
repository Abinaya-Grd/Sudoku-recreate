{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>OTP Login</title>
    <style>

body{
    margin:0;
    padding:0;
    background:#f5f5f5;
    font-family:Arial, Helvetica, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-box{
    width:350px;
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 4px 20px rgba(0,0,0,0.1);
    text-align:center;
}

.logo{
    width:160px;
    margin-bottom:15px;
}

h2{
    color:#c12e35;
    margin-bottom:25px;
}

input{
    width:100%;
    height:45px;
    border:1px solid #ddd;
    border-radius:12px;
    padding:0 15px;
    font-size:15px;
    outline:none;
    margin-bottom:18px;
    box-sizing:border-box;
}

input:focus{
    border:1px solid #c12e35;
}

button{
    width:100%;
    height:45px;
    border:none;
    border-radius:12px;
    background:#c12e35;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#a71f26;
}

#recaptcha-container{
    margin-bottom:15px;
    display:flex;
    justify-content:center;
}

.small-text{
    color:#777;
    font-size:13px;
    margin-top:12px;
}
.otp-boxes{
    display:flex;
    justify-content:space-between;
    margin:30px 0;
}

.otp-input{
    width:45px;
    height:50px;
    border:none;
    border-radius:10px;
    background:#d8dbd5;
    text-align:center;
    font-size:22px;
    outline:none;
}

.timer{
    font-size:32px;
    font-weight:bold;
    margin:20px 0;
}

.resend-text{
    margin-bottom:20px;
}

.resend-text span{
    color:green;
    font-weight:bold;
    cursor:pointer;
}

</style>
</head>

<body>

<div class="login-box">

    <div id="mobileSection">
          
    <img src="{% static 'images/logo.png' %}" class="logo">
        <h2>Login with MobileNumber</h2>

        <input
            type="text"
            id="mobile"
            placeholder="Enter Mobile Number"
        >

        <div id="recaptcha-container"></div>

        <button onclick="sendOTP()">
            Send OTP
        </button>

    </div>


    <div id="otpSection" style="display:none;">

        <h2>OTP Verification</h2>

        <p id="mobileText"></p>

        <div class="otp-boxes">

            <input maxlength="1" class="otp-input">
            <input maxlength="1" class="otp-input">
            <input maxlength="1" class="otp-input">
            <input maxlength="1" class="otp-input">
            <input maxlength="1" class="otp-input">
            <input maxlength="1" class="otp-input">

        </div>

        <div class="timer" id="timer">
            00:30
        </div>

        <p class="resend-text">
            Didn't get OTP?
            <span onclick="resendOTP()">Resend</span>
        </p>

        <button onclick="verifyOTP()">
            Verify OTP
        </button>

    </div>

</div>


<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyDX68lsWrqGPYOvsfXSdZ0JxDrOoweoz1o",
  authDomain: "ecommerce-c7f3b.firebaseapp.com",
  projectId: "ecommerce-c7f3b",
  storageBucket: "ecommerce-c7f3b.firebasestorage.app",
  messagingSenderId: "716190853734",
  appId: "1:716190853734:web:be94a7d128134035175ba7"
};

firebase.initializeApp(firebaseConfig);

window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier(
  "recaptcha-container",
  {
    size: "normal"
  }
);

function sendOTP(){

    var mobile = document.getElementById("mobile").value;

    if(mobile.length !== 10){
        alert("Enter valid 10 digit mobile number");
        return;
    }

    var phoneNumber = "+91" + mobile;

    firebase.auth().signInWithPhoneNumber(
        phoneNumber,
        window.recaptchaVerifier
    )
    .then(function(confirmationResult){

        window.confirmationResult = confirmationResult;

        document.getElementById("mobileSection").style.display = "none";

        document.getElementById("otpSection").style.display = "block";

        document.getElementById("mobileText").innerText =
            "OTP has been sent to +91 " + mobile;

        startTimer();

    })
    .catch(function(error){
        alert(error.message);
        console.log(error);
    });
}

let otpInputs = document.querySelectorAll(".otp-input");

otpInputs.forEach((input, index) => {
    input.addEventListener("input", () => {
        if(input.value && index < otpInputs.length - 1){
            otpInputs[index + 1].focus();
        }
    });
});

function getOTP(){
    let otp = "";

    otpInputs.forEach(input => {
        otp += input.value;
    });

    return otp;
}
function verifyOTP(){

    var otp = getOTP();

    window.confirmationResult.confirm(otp)
    .then(function(result){

        let mobile = document.getElementById("mobile").value;

        return fetch("/verify-otp/", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                mobileNumber: mobile,
                enteredOTP: "firebase_verified"
            })
        });
    })
    .then(function(response){
        return response.json();
    })
    .then(function(data){
        localStorage.removeItem("cartData");
        localStorage.removeItem("cartItemsData");
        localStorage.removeItem("selectedVariant");

        alert("Login success");
        window.location.href = "/";
    })
    .catch(function(error){
        alert("Invalid OTP");
        console.log(error);
    });
}

function startTimer(){

    let seconds = 30;

    let timer = document.getElementById("timer");

    let interval = setInterval(() => {

        seconds--;

        timer.innerText =
            "00:" + String(seconds).padStart(2, "0");

        if(seconds <= 0){
            clearInterval(interval);
        }

    }, 1000);
}

function resendOTP(){
   sendOTP();
}

</script>

</body>
</html>
