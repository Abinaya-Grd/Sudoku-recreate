{% load static %}
<!doctype html>
<html>
  <head>
    <title>Mycommerce</title>

<style>
body{
    background:#f5f5f5;
    font-family:Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.payment-card{
    width:420px;
    background:white;
    padding:35px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 0 15px rgba(0,0,0,0.1);
}

.payment-card h2{
    color:#c12e35;
    margin-bottom:10px;
}

.amount{
    font-size:32px;
    font-weight:bold;
    margin:25px 0;
    color:#222;
}

.pay-btn{
    width:100%;
    height:55px;
    border:none;
    background:#c12e35;
    color:white;
    font-size:18px;
    font-weight:bold;
    border-radius:30px;
    cursor:pointer;
}

.pay-btn:hover{
    background:#a6242b;
}
</style>
<body>
<div class="payment-card">

    <h2>Secure Payment</h2>

    <p>Total Amount</p>

    <div class="amount">
        ₹{{ display_amount }}
    </div>

    <button id="payBtn" class="pay-btn">
        Pay ₹{{ display_amount }}
    </button>

</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>
var options = {
    "key": "{{ key_id }}",
    "amount": "{{ amount }}",
    "currency": "INR",
    "name": "My Ecommerce",
    "description": "Cart Payment",
    "order_id": "{{ payment.id }}",

    "prefill": {
        "name": "Test User",
        "email": "test@example.com",
        "contact": "9999999999"
    },

    "handler": function(response){
        alert("Payment Successful");
        window.location.href = "/order-success/";
    },

    "theme": {
        "color": "#c12e35"
    }
};

var rzp = new Razorpay(options);

document.getElementById("payBtn").onclick = function(e){
    rzp.open();
    e.preventDefault();
}
</script>
</body>
</html>
